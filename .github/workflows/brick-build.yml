name: Brick package

on:
  push:
    branches: [dev/brick]
    paths:
      - ".github/workflows/brick-build.yml"
      - "Brick/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty for a commit-based version)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: brick-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build AArch64 package
    runs-on: ubuntu-latest
    container: debian:bullseye-slim
    timeout-minutes: 30

    steps:
      - name: Install cross-build tools
        run: |
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git \
            g++-aarch64-linux-gnu pkg-config python3 unzip \
            libsdl2-dev:arm64 libsdl2-image-dev:arm64 \
            libsdl2-ttf-dev:arm64 libasound2-dev:arm64
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Brick install ZIP
        id: build
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="dev-brick-${GITHUB_SHA::8}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Version may contain only letters, numbers, dot, underscore and hyphen"
            exit 1
          fi

          chmod +x Brick/build_app.sh
          PEGASUSG_VERSION="$version" \
          PEGASUSG_OUTPUT=Zip \
          PEGASUSG_SYSROOT=/ \
          CROSS_CXX=aarch64-linux-gnu-g++ \
            ./Brick/build_app.sh

          archive="Brick/dist/PegasusG-Brick-${version}.zip"
          test -f "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate package architecture and contents
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.build.outputs.archive }}"
          unpacked="$RUNNER_TEMP/brick-package"
          unzip -q "$archive" -d "$unpacked"
          binary="$unpacked/Apps/PegasusG/pegasusg_by_roc"
          test -x "$binary"
          aarch64-linux-gnu-readelf -h "$binary" | grep -q 'Machine:.*AArch64'
          test -x "$unpacked/Apps/PegasusG/launch.sh"
          test -s "$unpacked/Apps/PegasusG/version.txt"
          unzip -l "$archive"

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: PegasusG-Brick-${{ steps.build.outputs.version }}
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 30
