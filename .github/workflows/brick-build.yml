name: Brick package

on:
  push:
    branches: [dev/brick]
    paths:
      - ".github/workflows/brick-build.yml"
      - "Brick/**"
      - "src/**"
      - "assets/music/builtin/**"
      - "assets/ui/**"
      - "LICENSE.md"
      - "NOTICE.md"
      - "NOTICE.zh-CN.md"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (leave empty for a commit-based version)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: brick-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build AArch64 package
    runs-on: ubuntu-latest
    container: debian:bullseye-slim
    timeout-minutes: 30

    steps:
      - name: Install cross-build tools
        run: |
          dpkg --add-architecture arm64
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make \
            g++-aarch64-linux-gnu pkg-config python3 unzip \
            libsdl2-dev:arm64 libsdl2-image-dev:arm64 \
            libsdl2-ttf-dev:arm64 libasound2-dev:arm64
          rm -rf /var/lib/apt/lists/*

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build dedicated AArch64 gpSP rumble core
        shell: bash
        env:
          GPSP_REVISION: 5b6e751f4abf368509146cd143c949c1946ac1ae
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/gpsp-rumble"
          git clone https://github.com/libretro/gpsp.git "$source_dir"
          git -C "$source_dir" checkout --detach "$GPSP_REVISION"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$GPSP_REVISION"

          make -C "$source_dir" -j2 \
            platform=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CXX=aarch64-linux-gnu-g++ \
            AR=aarch64-linux-gnu-ar
          aarch64-linux-gnu-strip "$source_dir/gpsp_libretro.so"
          cp "$source_dir/gpsp_libretro.so" Brick/cores/gpsp_rumble_libretro.so

          aarch64-linux-gnu-readelf -h Brick/cores/gpsp_rumble_libretro.so \
            | grep -q 'Class:.*ELF64'
          aarch64-linux-gnu-readelf -h Brick/cores/gpsp_rumble_libretro.so \
            | grep -q 'Machine:.*AArch64'
          sha256sum Brick/cores/gpsp_rumble_libretro.so

      - name: Build Brick install ZIP
        id: build
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="dev-brick-${GITHUB_SHA::8}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Version may contain only letters, numbers, dot, underscore and hyphen"
            exit 1
          fi

          chmod +x Brick/build_app.sh
          PEGASUSG_VERSION="$version" \
          PEGASUSG_OUTPUT=Zip \
          PEGASUSG_SYSROOT=/ \
          CROSS_CXX=aarch64-linux-gnu-g++ \
            ./Brick/build_app.sh

          full_archive="Brick/dist/PegasusG-Brick-${version}-Full.zip"
          update_archive="Brick/dist/PegasusG-Brick-${version}-Update.zip"
          test -f "$full_archive"
          test -f "$update_archive"
          sha256sum "$full_archive" > "${full_archive}.sha256"
          sha256sum "$update_archive" > "${update_archive}.sha256"
          echo "full_archive=$full_archive" >> "$GITHUB_OUTPUT"
          echo "update_archive=$update_archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate package architecture and contents
        shell: bash
        run: |
          set -euo pipefail
          full_archive="${{ steps.build.outputs.full_archive }}"
          update_archive="${{ steps.build.outputs.update_archive }}"
          full="$RUNNER_TEMP/brick-full"
          update="$RUNNER_TEMP/brick-update"
          unzip -q "$full_archive" -d "$full"
          unzip -q "$update_archive" -d "$update"
          binary="$full/Apps/PegasusG/pegasusg_by_roc"
          test -x "$binary"
          aarch64-linux-gnu-readelf -h "$binary" | grep -q 'Machine:.*AArch64'
          test -x "$full/Apps/PegasusG/launch.sh"
          test -s "$full/Apps/PegasusG/config.json"
          test -s "$full/Apps/PegasusG/icon.png"
          test -s "$full/Apps/PegasusG/assets/ui/pegasus_g.png"
          test "$(find "$full/Apps/PegasusG/assets/music" -maxdepth 1 -type f -name '*.mp3' | wc -l)" -eq 11
          test -x "$update/Apps/PegasusG/pegasusg_by_roc"
          test ! -e "$full/Apps/PegasusG/ffmpeg"
          for core in mgba_libretro.so gpsp_libretro.so gpsp_rumble_libretro.so \
              vbam_libretro.so vba_next_libretro.so; do
            full_core="$full/Apps/PegasusG/cores/$core"
            update_core="$update/Apps/PegasusG/cores/$core"
            test -s "$full_core"
            test -s "$update_core"
            aarch64-linux-gnu-readelf -h "$full_core" | grep -q 'Class:.*ELF64'
            aarch64-linux-gnu-readelf -h "$full_core" | grep -q 'Machine:.*AArch64'
          done
          test ! -e "$full/System/starts/zz_pegasusg_autostart.sh"
          unzip -l "$full_archive"
          unzip -l "$update_archive"

      - name: Upload full install package
        uses: actions/upload-artifact@v4
        with:
          name: PegasusG-Brick-${{ steps.build.outputs.version }}-Full
          path: |
            ${{ steps.build.outputs.full_archive }}
            ${{ steps.build.outputs.full_archive }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload update package
        uses: actions/upload-artifact@v4
        with:
          name: PegasusG-Brick-${{ steps.build.outputs.version }}-Update
          path: |
            ${{ steps.build.outputs.update_archive }}
            ${{ steps.build.outputs.update_archive }}.sha256
          if-no-files-found: error
          retention-days: 30
